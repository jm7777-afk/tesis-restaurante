# ============================================================ #
# LOGROTATE CONFIGURATION - DONDE DAVID                        #
# ============================================================ #

/var/www/donde-david/logs/app.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 www-data www-data
    postrotate
        systemctl reload nginx 2>/dev/null || true
    endscript
}

/var/www/donde-david/logs/access.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 www-data www-data
}

/var/www/donde-david/logs/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 www-data www-data
}
