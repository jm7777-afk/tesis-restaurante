# ============================================================ #
# DONDE DAVID - RENDER DEPLOYMENT BLUEPRINT (PRODUCTION READY) #
# ============================================================ #

services:
  # ========================================================== #
  # BACKEND SERVICE                                            #
  # ========================================================== #
  - type: web
    name: donde-david-backend
    runtime: python
    repo: https://github.com/jm7777-afk/tesis-restaurante
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    preDeployCommand: |
      python -m alembic upgrade head
    startCommand: |
      cd backend
      gunicorn -c gunicorn.conf.py app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurante-g1a1
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://adondedavid-com.onrender.com
      - key: BACKEND_URL
        value: https://adondedavid-com.onrender.com
      - key: CORS_ORIGINS
        value: https://adondedavid-com.onrender.com,https://donde-david-backend.onrender.com,http://localhost:8000,http://127.0.0.1:8000
    healthCheckPath: /health
    autoDeploy: true

  # ========================================================== #
  # POSTGRESQL DATABASE (restaurante_g1a1)                      #
  # ========================================================== #
  - type: postgresql
    name: restaurante-g1a1
    plan: free
    database: donde_david_db
    user: postgres
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
