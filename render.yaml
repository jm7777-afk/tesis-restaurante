# ============================================================ #
# DONDE DAVID - RENDER DEPLOYMENT BLUEPRINT (DECOUPLED STACK)  #
# ============================================================ #

services:
  # ========================================================== #
  # 1. BACKEND REST API & WEBSOCKETS SERVICE                   #
  # ========================================================== #
  - type: web
    name: donde-david-backend
    runtime: python
    repo: https://github.com/jm7777-afk/tesis-restaurante
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    preDeployCommand: |
      python -m alembic upgrade head
    startCommand: |
      cd backend
      gunicorn -c gunicorn.conf.py app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: restaurante-g1a1
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://adondedavid-com.onrender.com,https://donde-david-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000
    healthCheckPath: /health
    autoDeploy: true

  # ========================================================== #
  # 2. FRONTEND STATIC SITE CLIENT                             #
  # ========================================================== #
  - type: web
    name: donde-david-frontend
    runtime: static
    repo: https://github.com/jm7777-afk/tesis-restaurante
    branch: main
    buildCommand: echo "Frontend static build complete"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  # ========================================================== #
  # 3. POSTGRESQL DATABASE                                     #
  # ========================================================== #
  - type: postgresql
    name: restaurante-g1a1
    plan: free
    database: donde_david_db
    user: postgres
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
