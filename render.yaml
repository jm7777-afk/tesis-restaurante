# ============================================================ #
# DONDE DAVID - RENDER DEPLOYMENT BLUEPRINT                     #
# ============================================================ #

services:
  # ========================================================== #
  # BACKEND SERVICE                                            #
  # ========================================================== #
  - type: web
    name: donde-david-backend
    runtime: python
    repo: https://github.com/jm7777-afk/tesis-restaurante
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend
      gunicorn -c gunicorn.conf.py app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: donde-david-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://donde-david.onrender.com
      - key: BACKEND_URL
        value: https://donde-david-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://donde-david.onrender.com,https://donde-david-backend.onrender.com
    healthCheckPath: /health
    autoDeploy: true

  # ========================================================== #
  # POSTGRESQL DATABASE                                         #
  # ========================================================== #
  - type: postgresql
    name: donde-david-db
    plan: free
    database: donde_david_db
    user: postgres
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
